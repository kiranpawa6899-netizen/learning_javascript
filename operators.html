<body>
    <!--Aritmatic operoter +,-,*,**,/,-->
    <script>
        var a=10;
        var b=4;
        var c=a+b; //binary
        document.write( c + "<br>");
        c++;//unary
        c++;
        c++;
        c--;
        c++;
        c--;
        c++;//17
        document.write(c+ "<br>");
    </script>

    <!--assignment operoter =,+=,-=,*= -->
    <script>
        var x=10;
        var y=12;
        x +=y;
        document.write(x + "<br>");//22
        document.write(y);//12
    </script>

    <!--comparison operoters <,>,<=,>=,=,==,===-->
    <script>
        var p=17;
        var q="17";
        document.write("<br>");
        if(p==q){
            document.write(true);
        }else{
            document.write(false);

        }

        document.write("<br>");

        var p=17;
        var q="17";
        document.write("<br>");
        if(p===q){
            document.write(true);
        }else{
            document.write(false);
        }
    </script>

    <script>
    <!--logical operator &&,||,|-->
    
    document.write("<br>");
     var age=22;
     if(age>=18 && age<=70){
        document.write("eligible for vote");
     }else{
         document.write("not eligible for vote");
     }
</script>
